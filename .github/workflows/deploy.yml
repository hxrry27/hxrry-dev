name: Deploy Site
on:
    push:
        branches: [ main ]
    workflow_dispatch:
jobs:
    deploy:
        runs-on: self-hosted
        steps:
            - name: Deploy to production
            run: |
                echo "Deploying to hxrry.dev"
                /home/hxrry27/docker/scripts/deploy-hxrry-dev.sh
            - name: Health check
            run: |
                sleep 10
                curl -f http://localhost:3000 || exit 1
                echo "production site is responding :D"